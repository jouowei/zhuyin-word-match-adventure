<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>認字大冒險</title>
    <!-- Installable app (add to home screen): opening it from the home screen also avoids LINE's built-in browser -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#818cf8" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="認字大冒險" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Sans+TC:wght@400;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    <!-- 教育部標準楷書: with built-in zhuyin (bpmfvs, OFL) and plain -->
    <link href="https://fonts.googleapis.com/css2?family=Bpmf+Zihi+Kai+Std&family=LXGW+WenKai+TC&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
        background-color: #f0f9ff;
        overscroll-behavior: none;
      }
      /* Custom Zhuyin vertical alignment helper if needed, though flex usually works */
      .zhuyin-text {
        font-feature-settings: "vrt2"; 
      }
      
      @keyframes pop {
        0% { transform: scale(0.8); opacity: 0; }
        100% { transform: scale(1); opacity: 1; }
      }
      
      @keyframes float {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-15px); }
        100% { transform: translateY(0px); }
      }

      @keyframes float-slow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-20px) rotate(5deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }

      @keyframes float-particle {
        0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
        10% { opacity: 0.6; }
        90% { opacity: 0.6; }
        100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
      }

      @keyframes shake {
        0% { transform: rotate(0deg); }
        25% { transform: rotate(-10deg); }
        50% { transform: rotate(10deg); }
        75% { transform: rotate(-10deg); }
        100% { transform: rotate(0deg); }
      }

      @keyframes wiggle {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }

      @keyframes spin-slow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      .animate-pop {
        animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }
      
      .animate-float {
        animation: float 3s ease-in-out infinite;
      }

      .animate-float-slow {
        animation: float-slow 6s ease-in-out infinite;
      }

      .animate-shake {
        animation: shake 0.5s ease-in-out infinite;
      }
      
      .animate-wiggle {
        animation: wiggle 2s ease-in-out infinite;
      }

      .animate-spin-slow {
        animation: spin-slow 10s linear infinite;
      }

      /* The companion breathes; things in the world sway, and jump when tapped */
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-6%); }
      }
      @keyframes sway {
        0%, 100% { transform: rotate(-4deg); }
        50% { transform: rotate(4deg); }
      }
      @keyframes hop {
        0%, 100% { transform: translateY(0) scale(1); }
        40% { transform: translateY(-35%) scale(1.25); }
      }
      .animate-bob { animation: bob 2.4s ease-in-out infinite; }
      .animate-sway { animation: sway 4s ease-in-out infinite; transform-origin: 50% 100%; }
      .animate-hop { animation: hop 0.6s ease-out; transform-origin: 50% 100%; }
      /* The button to press next: grows a little instead of fading, so it never looks switched off */
      @keyframes breathe {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      .animate-breathe { animation: breathe 1.8s ease-in-out infinite; }

      /* Child screens fit one screen: side by side on tablets and phones held sideways
         (!important: Tailwind's own styles are added after these and would win) */
      @media (orientation: landscape) and (min-width: 600px) {
        .fit-screen-main { flex-direction: row !important; }
        .fit-screen-side { width: min(20rem, 38%) !important; justify-content: center !important; }
      }
      /* Things that can go on phones held sideways, when there is no room */
      @media (max-height: 480px) {
        .hide-on-short-screen { display: none !important; }
      }
      /* Written instructions in games: only where there is room (they are also spoken) */
      @media (max-height: 859px) {
        .only-tall-screen { display: none !important; }
      }

      /* English: Andika is a literacy font with kid-friendly single-story a and g */
      .font-english {
        font-family: 'Andika', 'Zen Maru Gothic', sans-serif;
      }

      /* Chinese in textbook 楷書 with zhuyin drawn by the font (Bpmf Zihi Kai Std) */
      .font-bpmf {
        font-family: 'Bpmf Zihi Kai Std', 'DFKai-SB', 'BiauKai', serif;
        font-weight: normal;
        line-height: 1.2;
      }

      /* Lesson text reads top-to-bottom on phones, like the textbook */
      @media (max-width: 767px) {
        .lesson-text-line .font-bpmf {
          writing-mode: vertical-rl;
          max-height: 60vh;
        }
      }

      /* Plain 楷書 when the zhuyin must stay hidden (it is the question) */
      .font-kai {
        font-family: 'DFKai-SB', 'BiauKai', 'TW-Kai', 'LXGW WenKai TC', serif;
        font-weight: normal;
      }

      @keyframes shake-once {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-8px); }
        40%, 80% { transform: translateX(8px); }
      }

      .animate-shake-once {
        animation: shake-once 0.45s ease-in-out;
      }

      .text-stroke {
        -webkit-text-stroke: 2px white;
        text-shadow: 4px 4px 0px rgba(0,0,0,0.1);
      }

      /* Override react-bpmf to display horizontally and wrap properly */
      div[class*="BpmfTextBlock__BlockContainer"] {
        display: flex !important;
        writing-mode: horizontal-tb !important;
        flex-wrap: wrap !important;
        justify-content: center !important;
        align-items: center !important;
        gap: 0.2em;
      }

      /* Vertical display for lesson text on mobile */
      .lesson-text-line div[class*="BpmfTextBlock__BlockContainer"] {
        writing-mode: vertical-rl !important;
        max-height: 60vh; /* Prevent it from being infinitely tall on mobile */
      }

      @media (min-width: 768px) {
        .lesson-text-line div[class*="BpmfTextBlock__BlockContainer"] {
          writing-mode: horizontal-tb !important;
          max-height: none;
        }
      }

      div[class*="BpmfText__BpmfWrap"] {
        display: inline-block !important;
        writing-mode: vertical-rl !important;
      }

      /* Fix rt display to ensure proper ruby layout */
      ruby[class*="BpmfText__BpmfContent"] {
        ruby-position: over !important;
      }
      
      rt[class*="BpmfText__BpmfReading"] {
        display: ruby-text !important;
        writing-mode: vertical-rl !important;
      }

      span[class*="BpmfText__BpmfTone"] {
        display: inline-block !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.1/",

</html>
